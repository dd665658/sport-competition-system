<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход · Спартакиада колледжей</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .login-card {
            background: white;
            border: 1px solid #ddd;
            width: 100%;
            max-width: 360px;
            padding: 2rem;
        }

        .fade-in {
            animation: fadeIn 1s ease;
        }

        .login-card h2 {
            font-size: 1.8rem;
            font-weight: 500;
            letter-spacing: -0.5px;
            color: #1a1a1a;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .form-label {
            font-size: 0.9rem;
            font-weight: 400;
            color: #555;
            margin-bottom: 0.3rem;
        }

        .form-control {
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 0.6rem 0.75rem;
            font-size: 0.95rem;
            transition: border 0.2s;
        }

            .form-control:focus {
                border-color: #999;
                outline: none;
            }

            .form-control.error-field {
                border-color: #e53e3e;
                background-color: #fff5f5;
            }

        .btn-login {
            background-color: #222;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 0.7rem;
            font-size: 1rem;
            font-weight: 500;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }

            .btn-login:hover {
                background-color: #000;
            }

        .error-message {
            color: #e53e3e;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 1rem;
            min-height: 1.5rem;
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }

            10%, 30%, 50%, 70%, 90% {
                transform: translateX(-3px);
            }

            20%, 40%, 60%, 80% {
                transform: translateX(3px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .shake-animation {
            animation: shake 0.5s ease-in-out;
        }

        .signup-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #666;
        }

            .signup-link a {
                color: #222;
                text-decoration: none;
                border-bottom: 1px solid #ccc;
                padding-bottom: 1px;
            }

                .signup-link a:hover {
                    border-bottom-color: #222;
                }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Вход в систему</h2>
        <form id="loginForm">
            <div class="mb-3">
                <label for="login" class="form-label">Имя пользователя</label>
                <input type="text" class="form-control" id="login" placeholder="" autocomplete="off">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Пароль</label>
                <div style="position: relative;">
                    <input type="password"
                           class="form-control"
                           id="password"
                           placeholder="••••••••"
                           style="padding-right: 2.5rem;">

                    <i class="bi bi-eye-slash"
                       id="togglePasswordIconMain"
                       onclick="toggleMainPassword()"
                       style="
           position: absolute;
           right: 10px;
           top: 50%;
           transform: translateY(-50%);
           cursor: pointer;
           color: #64748b;
           font-size: 1.1rem;
       ">
                    </i>
                </div>
            </div>
            <button type="submit" class="btn-login">Войти</button>
            <div id="error-message" class="error-message"></div>
        </form>
        <div class="signup-link">
            <a href="#">Login as guest</a>
        </div>
    </div>

    <script>

        function toggleMainPassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('togglePasswordIconMain');

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            } else {
                input.type = 'password';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            }
        }
        // Запускаем анимацию появления один раз при загрузке
        document.addEventListener('DOMContentLoaded', function () {
            const loginCard = document.querySelector('.login-card');

            // Добавляем класс с анимацией
            loginCard.classList.add('fade-in');

            // Через 0.5 секунд удаляем класс, чтобы анимация не мешала при тряске
            setTimeout(() => {
                loginCard.classList.remove('fade-in');
            }, 1000);
        });

        // Функция ошибки (только тряска, без анимации появления)
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            const loginInput = document.getElementById('login');
            const passwordInput = document.getElementById('password');
            const loginCard = document.querySelector('.login-card');

            errorDiv.textContent = message;
            loginInput.classList.add('error-field');
            passwordInput.classList.add('error-field');

            // Только тряска
            loginCard.classList.add('shake-animation');

            setTimeout(() => {
                loginCard.classList.remove('shake-animation');
            }, 500);

            setTimeout(() => {
                loginInput.classList.remove('error-field');
                passwordInput.classList.remove('error-field');
            }, 2000);
        }

        function clearErrorOnInput() {
            const errorDiv = document.getElementById('error-message');
            const loginInput = document.getElementById('login');
            const passwordInput = document.getElementById('password');

            if (errorDiv.textContent) {
                errorDiv.textContent = '';
                loginInput.classList.remove('error-field');
                passwordInput.classList.remove('error-field');
            }
        }

        document.getElementById('login').addEventListener('input', clearErrorOnInput);
        document.getElementById('password').addEventListener('input', clearErrorOnInput);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const login = document.getElementById('login').value;
            const password = document.getElementById('password').value;

            if (!login || !password) {
                showError('Пожалуйста, заполните все поля!');
                return;
            }

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('role', data.role);

                    if (data.role === 'admin') {
                        window.location.replace('/admin.html');
                    } else if (data.role === 'representative') {
                        localStorage.setItem('collegeName', data.collegeName);
                        localStorage.setItem('collegeId', data.collegeId);
                        window.location.replace('/representative.html');
                    } else {
                        showError('Unknown role');
                    }
                } else {
                    showError(data.message || 'Неверный пароль.');
                }
            } catch (error) {
                showError('Connection error. Please try again.');
            }
        });
    </script>
</body>
</html>
